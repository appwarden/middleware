version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Limit to security updates only
    open-pull-requests-limit: 10
    # Align with pnpm v11 default minimumReleaseAge (1 day / 1440 minutes)
    cooldown:
      default-days: 1
    versioning-strategy: increase
    ignore:
      # Ignore major version updates for zod - requires manual migration
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - "*eslint*"
          - "*prettier*"
          - "*test*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*eslint*"
          - "*prettier*"
          - "*test*"
        update-types:
          - "minor"
          - "patch"
    # Specify labels for npm pull requests
    labels:
      - "npm"
      - "dependencies"
    # Add reviewers
    reviewers:
      - "appwarden/maintainers"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Specify labels for GitHub Actions pull requests
    labels:
      - "github-actions"
      - "dependencies"
    # Add reviewers
    reviewers:
      - "appwarden/maintainers"
